      note: "With the answer 2^⌊k/4⌋."
    - source: "White & Claude, Theorem; Cipollini's first bound"
      lean: "Erdos1063.Results.subexp_bound"
      module: "Challenge"
      status: "proved"
      note: "Explicit form with C = 100 for k ≥ 2^64 is Erdos1063.Results.n_le_exp_of_ge."
    - source: "White & Claude, 'In particular, n_k = exp(o(k))'"
      lean: "Erdos1063.Results.exp_littleO"
      module: "Challenge"
      status: "proved"
    - source: "jbell31's coverage argument (e = n mod k, D(k, e) ∣ n − e), from rickyc's identity"
      lean: "Erdos1063.Results.eq_mod_and_dvd"
      module: "Challenge"
      status: "proved"
      note: "For every admissible n, not only n_k."
    - source: "jbell31's wheel (skip rule for primes k/2 < p ≤ k)"
      lean: "Erdos1063.Results.wheel"
      module: "Challenge"
      status: "proved"
    - source: "rickyc's lower bound (forum, 2026-07-10)"
      lean: "Erdos1063.Results.lower_bound"
      module: "Challenge"
      status: "proved"


# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4, for the Palomar registry (https://palomar-registry.org).
version: "v0.4"

project:
  name: "Erdős Problem #1063: a subexponential upper bound for n_k, a lower bound, and the structure of admissible n"
  description: >-
    Lean 4 / Mathlib proofs about n_k, the least n ≥ 2k such that exactly one of
    n, n−1, …, n−k+1 fails to divide the binomial coefficient C(n, k) (Erdős–Selfridge,
    erdosproblems.com/1063). Upper bounds: n_k ≤ exp(C·k·log log k / log k) for all large k
    (explicitly C = 100 for every k ≥ 2^64), hence n_k = exp(o(k)); and the answer 2^⌊k/4⌋ to
    the open formal-conjectures statement erdos_1063.better_upper, which asks for an upper
    bound that is o(k·lcm(1, …, k−1)) (Cambie's bound). Structure: for every n ≥ 2k with exactly
    one failing index e, e = n mod k, n − e is divisible by
    D(k, e) = ∏_{p^a ∥ k} p^(a + v_p(C(k−1, e)) + ⌊log_p max(e, k−1−e)⌋), and for each prime
    k/2 < p ≤ k a lone multiple of p in the window is n − e. Lower bound:
    n_k ≥ ∏_{p^a ∥ k} p^(a + ⌊log_p(k−1)⌋). These formalise statements that were claimed
    informally, without review, in 2026: the upper bound by R. Cipollini (with GPT-5.6 Sol) and
    by P. White & Claude (construction by GPT-5.6 Sol), and the structural facts and lower bound
    in the erdosproblems.com forum by rickyc (R. Cipollini) and jbell31. The proof of the upper bound follows Cipollini's construction
    with cruder, elementary estimates (the primorial bound ∏_{p ≤ k} p ≤ 4^k instead of the
    prime number theorem), so it does not reach his sharp constant. The question "estimate n_k"
    remains open: the bounds are far apart.
  authors:
    - "Ákos Kubák"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Ákos Kubák"

classification:
  arxiv: [math.NT]
  msc2020: [11B65, 11A05, 11N25]

sources:
  - title: "Erdős Problem #1063 (problem statement and forum thread)"
    contributors:
      - name: "Paul Erdős"
        role: "problem-proposer"
      - name: "John L. Selfridge"
        role: "problem-proposer"
      - name: "Thomas F. Bloom"
        role: "maintainer of erdosproblems.com"
    id: "https://www.erdosproblems.com/1063"
    type: "web discussion"
    relationship: background
    note: "The problem: estimate n_k. The page records Monier's n_k ≤ k! and Cambie's n_k ≤ k·lcm(2, …, k−1)."
    author_endorsement: "not-contacted"
  - title: "An upper bound for Erdős–Selfridge Problem 1063"
    authors:
      - "Ricky Cipollini"
    id: "https://www.overleaf.com/read/hrpsqsnqktky"
    type: "other"
    relationship: adapts
    note: >-
      Unreviewed note (2026-07-27; the paper states it was written by GPT-5.6 Sol), posted as a
      proof claim on erdosproblems.com. It claims log n_k ≤ (k/log k)(log log k + log log log k +
      log 2 + o(1)) using the prime number theorem, Mertens and Brun–Titchmarsh. This
      formalisation uses its local lemmas (carry criterion, stabilization, one carry, Lucas) and
      its construction, with a simpler modulus and elementary estimates, and proves the weaker
      bound exp(O(k log log k / log k)), which the paper reports as Cipollini's first result.
    author_endorsement: "not-contacted"
  - title: "Erdős Problem #1063: a substantially stronger upper bound on n_k"
    authors:
      - "Patrick White"
    contributors:
      - name: "Claude (Anthropic)"
        role: "co-author of the claim, as stated by the repository"
      - name: "GPT-5.6 Sol (OpenAI, via Codex)"
        role: "produced the construction, as stated by the repository"
    id: "https://github.com/pw/erdos1063-upper-bound/tree/a28481f5b4bda374086533397269c5b550c759b8"
    type: "other"
    relationship: independently-proves
    note: >-
      Unreviewed claim (2026-07-25, repository README): there is an absolute constant C such that
      n_k ≤ exp(C·k·log log k / log k) for all sufficiently large k. Its construction is
      different (excused index ⌈k/(log k)^3⌉, p^2-anchors for exceptional primes, one Dirichlet
      box); it is not the argument formalised here. subexp_bound proves its statement.
    author_endorsement: "not-contacted"
  - title: "erdosproblems.com/1063 forum: lower bound and its proof (comments of 2026-06-26 and 2026-07-10)"
    contributors:
      - name: "rickyc (Ricky Cipollini)"
        role: "forum author; the 2026-06-26 comment states AI assistance (GPT-5.5 Thinking), and the 2026-07-10 comment states it was written by GPT-5.6 Sol"
    id: "https://www.erdosproblems.com/forum/thread/1063"
    type: "web discussion"
    relationship: formalizes
    note: >-
      The comments argue n_k ≥ max(2k, ∏_{p^a ∥ k} p^(a + ⌊log_p(k−1)⌋)) for n = n_k, via the
      identity v_p(n − e) = a + v_p(C(n, k)) + v_p(C(k−1, e)). lower_bound formalises the bound;
      the Lean versions of the structural facts hold for every admissible n.
    author_endorsement: "not-contacted"
  - title: "erdosproblems.com/1063 forum: extension of OEIS A389360 to k = 75 (comment of 2026-07-28)"
    contributors:
      - name: "jbell31"
        role: "forum author; the comment states AI assistance (Claude)"
    id: "https://www.erdosproblems.com/forum/thread/1063"
    location: "https://github.com/Jaybell31/dreamwalk/blob/be54a5c39f69fd178ef153b9477bfead782d614d/erdos1063/erdos1063_sweep.c"
    type: "web discussion"
    relationship: formalizes
    note: >-
      The coverage argument of that exhaustive search uses e = n mod k and D(k, e) ∣ n − e,
      which jbell31 credits to rickyc's argument and states for every solution, and a skip rule
      for primes k/2 < p ≤ k (the 'wheel'), which appears in the search code (pinned above).
      eq_mod_and_dvd and wheel formalise these facts for every admissible n. The search's
      computation itself is not checked here.
    author_endorsement: "not-contacted"
  - title: "Problem 6447"
    authors:
      - "Paul Erdős"
      - "John L. Selfridge"
    location: "Amer. Math. Monthly (1983), 710"
    type: "paper"
    relationship: background
  - title: "Unsolved Problems in Number Theory, 3rd ed., Problem B31"
    authors:
      - "Richard K. Guy"
    location: "Springer, 2004"
    type: "book"
    relationship: background
    note: "Records n_2 = 4, n_3 = 6, n_4 = 9, which the statement checks reproduce in Lean."

related_formalizations:
  - id: "https://github.com/google-deepmind/formal-conjectures/blob/dbb5a21169ce4094913e6cad34faedd74df55157/FormalConjectures/ErdosProblems/1063.lean"
    relationship: builds-on

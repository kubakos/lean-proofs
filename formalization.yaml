      The definition of n and the statement erdos_1063.better_upper are copied verbatim from this
      file (Challenge.lean; Research/Erdos1063/Statement.lean is generated from it and pinned by
      tools/fc_statement.py). better_upper answers FC's `answer(sorry)` with 2^⌊k/4⌋. The proof is
      checked against the copy under this repository's Mathlib, not inside FC's environment.

status:
  scope: >-
    Proved, with no sorry: the seven Challenge theorems (better_upper, subexp_bound,
    n_le_exp_of_ge, exp_littleO, eq_mod_and_dvd, wheel, lower_bound). Not formalised: Cipollini's
    sharp constant (it needs the prime number theorem with an error term), Cipollini's claimed
    lower bound log n_k ≥ c (log k)^2, and any bound of the true order of n_k, which is open.
    The constant C = 100 is crude: n_le_exp_of_ge improves on Cambie's bound only for
    k > 10^281. lower_bound improves on n_k ≥ 2k only for composite k ≠ 4.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["Claude Opus 5.5 (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        An AI agent wrote the Lean statements, proofs, statement checks and tooling, and ran
        the literature searches, working autonomously in sessions directed by the maintainer.
        The maintainer chose the problem and decided what to publish. Separate agent instances
        did the cold reviews listed under review.
      cost:
        wall_time: "two days of agent sessions (2026-10-06 to 2026-10-07)"
        spend_usd: "not tracked"
        hardware: "local workstation"
      prompting_notes: >-
        Standing instructions: nothing counts as proved until an axiom allowlist check passes,
        the formal statement is checked against the source text before work on it, the
        literature is searched before an attack, and every claim is reviewed by a cold skeptic
        before it is called a result.
  spend_usd: "not tracked"
  notes: >-
    The mathematics formalised here was proposed by others, as recorded under sources; the
    agent adapted Cipollini's construction with elementary estimates. The maintainer did not
    write the proofs.

fidelity:
  divergences: >-
    better_upper answers the FC statement with the explicit 2^⌊k/4⌋, rather than the sharper
    bounds of the sources. subexp_bound is White & Claude's statement, proved by a different
    construction (Cipollini's). The structural facts are stated for every admissible n; the
    forum argues them for n = n_k. Statements use ℕ throughout; n_k is FC's sInf definition,
    whose defining set is non-empty for every k ≥ 2 (proved in Research/Erdos1063/Existence.lean).

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 cold-review agents (separate instances with no session context; four reviews, the last of the whole package)"
  notes: >-
    For each result: an axiom allowlist check (propext, Classical.choice, Quot.sound only);
    statement checks proved in Lean (n_2, n_3, n_4; the false variant n_k = o(k) refuted;
    Cambie's bound is not an answer; the variant of subexp_bound without the factor k refuted;
    subexp_bound implies n_k = exp(o(k)); the strengthened lower bound refuted at k = 4;
    72 ≤ n_6 ≤ 75); a literature and code search for earlier Lean proofs (none found, as of
    2026-10-07); and a cold review that tried to break statement and claim. All requested
    changes were applied. No human mathematician has reviewed the proofs; the Lean kernel checks
    them.

